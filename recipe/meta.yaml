{% set name = "kernels" %}
{% set version = "0.13.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # GitHub archive rather than the PyPI sdist: the 0.13.0 sdist does not bundle
  # the LICENSE file (Apache-2.0 is declared as text only), and AR requires
  # license_file. The GitHub tag ships LICENSE at the repo root, and the version
  # is hardcoded in pyproject.toml (no setuptools_scm), so building from the
  # archive is equivalent.
  url: https://github.com/huggingface/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1ae1b2862cfd62a64f0d3bac196f46d097d4f45b1a779ccfc714eeeb81fa0212

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - kernels = kernels.cli:main

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - huggingface_hub >=1.3.0,<2.0
    - packaging >=20.0
    - pyyaml >=6
    - tomli >=2.0  # [py<311]
    - tomlkit >=0.13.3

test:
  imports:
    - kernels
  commands:
    - pip check
    - kernels --help
  requires:
    - pip

about:
  home: https://github.com/huggingface/kernels
  summary: Download compute kernels
  description: |
    kernels lets you load and run pre-compiled compute kernels from the Hugging
    Face Hub directly in Python, without building them locally. It resolves the
    right kernel variant for the running platform and integrates the fetched
    kernels into PyTorch layers at runtime.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://huggingface.co/docs/kernels
  dev_url: https://github.com/huggingface/kernels

extra:
  recipe-maintainers:
    - danieldk
