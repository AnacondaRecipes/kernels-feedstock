{% set name = "kernels" %}
{% set version = "0.13.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Build from the PyPI sdist (a proper standalone project: pyproject.toml at
  # root, src/ layout). Its only shortcoming is that it does not bundle the
  # LICENSE file, and AR requires license_file. The GitHub tag is a monorepo
  # (kernels/, kernel-builder/, kernel-abi-check/) whose LICENSE lives at the
  # archive root, so it cannot be the build source directly — it is pulled into
  # license_src/ solely to satisfy license_file.
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: bf7908206009bff0017d09b87f0f6b5934a1a20520562caf1cbb06cab36418cc
  - url: https://github.com/huggingface/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 1ae1b2862cfd62a64f0d3bac196f46d097d4f45b1a779ccfc714eeeb81fa0212
    folder: license_src

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - kernels = kernels.cli:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - huggingface_hub >=1.3.0,<2.0
    - packaging >=20.0
    - pyyaml >=6
    - tomli >=2.0  # [py<311]
    - tomlkit >=0.13.3
  run_constrained:
    # abi-check extra — kernel-abi-check is not on pkgs/main yet, so this is
    # inert today, but the bounded optional extra belongs here per convention.
    - kernel-abi-check >=0.6.2,<0.7.0

test:
  imports:
    - kernels
  commands:
    - pip check
    - kernels --help
  requires:
    - pip

about:
  home: https://github.com/huggingface/kernels
  summary: Download compute kernels
  description: |
    kernels lets you load and run pre-compiled compute kernels from the Hugging
    Face Hub directly in Python, without building them locally. It resolves the
    right kernel variant for the running platform and integrates the fetched
    kernels into PyTorch layers at runtime.
  license: Apache-2.0
  license_family: Apache
  license_file: license_src/LICENSE
  doc_url: https://huggingface.co/docs/kernels
  dev_url: https://github.com/huggingface/kernels

extra:
  recipe-maintainers:
    - danieldk
